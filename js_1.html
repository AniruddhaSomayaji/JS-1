<!DOCTYPE html>
<html>
  <head>
    <title>Simple Calculator</title>
  </head>
  <body>
<h1>Simple Calculator</h1>
<p>Perform all operations using JavaScript</p>
<p id="add"></p>
<p id="sub"></p>
<p id="mul"></p>
<p id="div"></p>
<script>
 
  var num1 = 10;
  var num2 = 5;

  // Addition
  var sum = num1 + num2;
  document.getElementById("add").innerHTML = "Addition: " + sum;

  // Subtraction
  var difference = num1 - num2;
  document.getElementById("sub").innerHTML = "Subtraction: " + difference;

  // Multiplication
  var product = num1 * num2;
  document.getElementById("mul").innerHTML = "Multiplication: " + product;

  // Division
  var quotient = num1 / num2;
  document.getElementById("div").innerHTML = "Division: " + quotient;
</script>
  </body>
